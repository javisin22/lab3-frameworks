<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bootstrap Task Manager</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Latest compiled and minified CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Latest compiled JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    </head>

    <body class="container mt-3">
        

        <!--
            TO-DO: Turn the nav menu into toggleable navigation pills. 
                   Make the "Add Task" tab active by default.
        -->
        <ul class="nav nav-pills">
            <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="pill" href="#add">Add Task</a></li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="pill" href="#tasks">Task List</a></li>
        </ul>

        

        <div class="tab-content">
            <div class="tab-pane container active" id="add">
                <div id="add">
                    <br />
                    <div class="card mt-4">
                        <div class="card-title bg-primary text-white px-4 py-4">Add Task</div>
                        <div class="card-body">
                            <form id="taskForm">
                                <div class="mb-3 form-group">
                                    <label for="taskName"  class="py-4">Task Name</label>
                                    <input type="text" id="taskName"  class="form-control " required>
                                </div>
                                <div class="mb-3 form-group">
                                    <label for="taskDescription" class="py-4">Task Description</label>
                                    <textarea id="taskDescription" class="form-control" rows="3" required></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">Add Task</button>
                            </form>
                        </div>
                    </div>     
                </div>
            </div>
            <div class="tab-pane container fade" id="tasks">
                <div id="tasks">
                    <br />
        
                    <div class="card mt-4">
        

                        <div class="card-title bg-primary px-4 text-white py-4 font-bold">Task List</div>
        

                        <div class="card-body">
        

                            <table class="table table-hover"> 
                                <thead>
                                    <tr>
                                        <th scope="col">#</th>
                                        <th scope="col">Task Name</th>
                                        <th scope="col">Description</th>
                                        <th scope="col">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="taskList">
                                    <!-- Tasks will be dynamically added here. -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
  
        

        

    <script src="js/add.js"></script>

    </body>
</html>
